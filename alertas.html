<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Alertas de preço | Economizaí</title><link rel="stylesheet" href="institutional.css">
  <style>
    :root{--yellow:#ffc42d;--panel:#171717;--border:#303030;--muted:#aaa}.activity{max-width:1120px;margin:0 auto;padding:50px 24px 80px}.activity h1{margin:0;color:var(--yellow);font:800 32px Sora,system-ui}.lead{margin:7px 0 28px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:18px;align-items:stretch}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:430px;height:100%}.card-media{height:220px;flex:0 0 220px;background:linear-gradient(135deg,#1e1e1e,#141414);display:flex;align-items:center;justify-content:center;position:relative}.card-media img{width:100%;height:100%;object-fit:contain;padding:12px}.discount-flag{position:absolute;top:10px;left:10px;padding:7px 10px;border-radius:6px;background:var(--yellow);color:#111;font:800 14px Sora,system-ui}.store-badge{position:absolute;top:10px;right:10px;padding:4px 8px;border-radius:5px;background:#000a;color:#fff;font-size:10.5px;font-weight:600}.card-body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:12px;flex:1}.card-title{font-size:13.5px;font-weight:600;line-height:1.35;min-height:55px}.price-block{display:flex;flex-direction:column;gap:2px;padding-top:4px;border-top:1px dashed var(--border)}.price-old-row,.price-new-row{display:flex;align-items:baseline;gap:7px}.price-old{color:#aaa;text-decoration:line-through;font:13px JetBrains Mono,monospace}.price-old-label,.price-new-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}.price-old-label{color:#aaa}.price-new-label{color:var(--yellow);font-weight:700}.price-new{color:var(--yellow);font:700 23px JetBrains Mono,monospace}.alert-meta{margin-top:auto;padding:10px;border:1px solid #3c3520;border-radius:8px;background:#211e15;color:#ded4b3;font-size:12px;line-height:1.45}.alert-meta strong{color:var(--yellow)}.card-actions{display:grid;grid-template-columns:1fr auto;gap:8px}.card-cta,.remove{border:0;border-radius:7px;padding:10px;text-align:center;font:700 13.5px Inter,system-ui;cursor:pointer;text-decoration:none}.card-cta{background:var(--yellow);color:#111}.remove{border:1px solid #3b3b3b;background:#202020;color:#f1b0aa}.empty{padding:45px 20px;border:1px dashed #3a3a3a;border-radius:13px;color:#aaa;text-align:center}.empty a{color:var(--yellow);font-weight:800}@media(max-width:600px){.activity{padding:34px 16px 55px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{min-height:390px}.card-media{height:150px;flex-basis:150px}.card-title{font-size:13px;min-height:68px}.price-new{font-size:18px}.card-actions{grid-template-columns:1fr}.remove{padding:8px}}
  </style>
</head>
<body><header data-site-header></header><main class="activity"><h1>Alertas de preço</h1><p class="lead">Produtos que você escolheu acompanhar. O alerta é marcado quando o preço for atualizado no painel.</p><div id="content" class="grid"></div></main><footer class="site-footer" data-site-footer></footer><script src="site.js"></script><script src="page-shell.js"></script><script src="alertas.js"></script></body>
</html>
