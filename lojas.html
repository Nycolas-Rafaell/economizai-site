<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lojas parceiras | Economizaí</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="institutional.css"><link rel="stylesheet" href="lojas.css">
</head>
<body>
  <header data-site-header></header>
  <main class="stores-page">
    <section class="stores-hero"><p class="eyebrow">Ofertas por marketplace</p><h1 id="pageTitle">Lojas no Economizaí</h1><p id="pageLead">Escolha uma loja para ver apenas as ofertas cadastradas nela.</p></section>
    <section class="stores-content">
      <nav class="store-tabs" id="storeTabs" aria-label="Filtrar ofertas por loja"></nav>
      <div class="store-heading"><div><h2 id="offersTitle">Todas as ofertas por loja</h2><p id="offersCounter">Carregando ofertas…</p></div><a class="back-offers" href="index.html">← Ver todas as ofertas</a></div>
      <div class="offers-grid" id="offers"></div>
      <p class="stores-empty" id="empty" hidden>Nenhuma oferta disponível nesta loja no momento.</p>
    </section>
  </main>
  <footer class="site-footer" data-site-footer></footer>
  <script src="lojas.js"></script>
</body>
</html>
