<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minha conta | Economizaí</title><link rel="stylesheet" href="institutional.css">
  <style>
    .account{max-width:820px;margin:0 auto;padding:52px 24px 80px}.account h1{font:800 32px Sora,system-ui;color:#ffc42d;margin:0 0 6px}.lead{margin:0 0 26px;color:#aaa}.panel{padding:25px;background:#171717;border:1px solid #303030;border-radius:14px;margin-bottom:16px}.panel h2{margin:0 0 16px;font:800 20px Sora,system-ui}.profile-top{display:flex;gap:22px;align-items:center;margin-bottom:25px}.avatar-wrap{position:relative;width:120px;height:120px;flex:0 0 auto}.avatar-main{width:120px;height:120px;display:block;object-fit:cover;border-radius:14px;background:#111;border:2px solid #ffc42d}.photo-button{position:absolute;right:-8px;bottom:-8px;display:grid;place-items:center;border:0;border-radius:50%;width:38px;height:38px;background:#ffc42d;color:#111;cursor:pointer;box-shadow:0 3px 10px #0007;transition:transform .18s ease}.photo-button:hover{transform:scale(1.08)}.photo-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.email{color:#aaa;margin:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;margin:15px 0 7px;font-weight:700}input{width:100%;box-sizing:border-box;border:1px solid #3a3a3a;border-radius:9px;background:#111;color:#fff;padding:13px;font:inherit}input:disabled{color:#aaa}.avatar-options{display:grid;grid-template-columns:repeat(6,minmax(54px,1fr));gap:10px;margin-top:13px}.avatar-option{padding:3px;border:2px solid transparent;border-radius:11px;background:#111;cursor:pointer}.avatar-option.selected{border-color:#ffc42d}.avatar-option img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.button{border:0;border-radius:8px;background:#ffc42d;color:#111;padding:12px 15px;font:800 14px Inter,system-ui;cursor:pointer;text-decoration:none}.button.secondary{background:#191919;color:#ffc42d;border:1px solid #3a3a3a}.status{display:none;margin:13px 0 0;padding:11px 13px;border:1px solid #2d714c;border-radius:9px;background:#13251a;color:#91e5b0;font-size:14px}.status:not(:empty){display:block}.status.error{border-color:#6d3d3a;background:#251a1a;color:#ffb0b0}.future{color:#aaa;margin:0;line-height:1.6}.dialog{margin-top:18px;padding-top:18px;border-top:1px solid #303030}.dialog[hidden]{display:none}@media(max-width:560px){.account{padding:34px 16px 55px}.row{grid-template-columns:1fr}.profile-top{align-items:flex-start}.avatar-options{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
  <header data-site-header></header>
  <main class="account">
    <h1>Minha conta</h1><p class="lead">Gerencie o seu perfil no Economizaí.</p>
    <section class="panel"><h2>Perfil</h2>
      <div class="profile-top"><div class="avatar-wrap"><img class="avatar-main" id="avatarPreview" src="assets/avatars/avatar-1.png" alt="Foto de perfil"><label class="photo-button" for="avatarUpload" title="Alterar foto de perfil" aria-label="Alterar foto de perfil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></label><input id="avatarUpload" type="file" accept="image/png,image/jpeg,image/webp" hidden></div><p class="email" id="email">Carregando…</p></div>
      <form id="profileForm"><div class="row"><div><label for="name">Nome</label><input id="name" maxlength="80" autocomplete="name"></div><div><label for="displayName">Apelido social</label><input id="displayName" maxlength="80" autocomplete="nickname"></div></div><label for="accountEmail">E-mail cadastrado</label><input id="accountEmail" type="email" disabled><label for="phone">Telefone / WhatsApp <small>(opcional)</small></label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="Ex.: 11999999999"><p class="future">Usado somente se você optar por receber alertas também no WhatsApp.</p><label>Escolha um avatar</label><div class="avatar-options" id="avatarOptions"></div><div class="actions"><button class="button" type="submit">Salvar perfil</button><a class="button secondary" id="adminLink" href="analytics.html" hidden>Painel administrativo</a><button class="button secondary" id="changeEmail" type="button">Trocar e-mail</button><button class="button secondary" id="changePassword" type="button">Trocar senha</button><button class="button secondary" id="logout" type="button">Sair da conta</button></div></form>
      <div class="dialog" id="emailDialog" hidden><label for="newEmail">Novo e-mail</label><input id="newEmail" type="email" autocomplete="email"><label for="emailCurrentPassword">Confirme sua senha atual</label><input id="emailCurrentPassword" type="password" autocomplete="current-password"><div class="actions"><button class="button" id="saveEmail" type="button">Alterar e-mail</button><button class="button secondary" type="button" data-close="emailDialog">Cancelar</button></div></div>
      <div class="dialog" id="passwordDialog" hidden><label for="currentPassword">Senha atual</label><input id="currentPassword" type="password" autocomplete="current-password"><label for="newPassword">Nova senha</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password"><label for="confirmPassword">Repita a nova senha</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password"><div class="actions"><button class="button" id="savePassword" type="button">Alterar senha</button><button class="button secondary" type="button" data-close="passwordDialog">Cancelar</button></div></div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>
    <section class="panel"><h2>Minha atividade</h2><p class="future">Acompanhe suas ofertas sem precisar de serviços pagos.</p><div class="actions"><a class="button secondary" href="favoritos.html">Meus favoritos</a><a class="button secondary" href="alertas.html">Meus Alertas</a><a class="button secondary" href="vistos-recentemente.html">Vistos recentemente</a></div></section>
  </main>
  <footer class="site-footer" data-site-footer></footer><script src="site.js"></script><script src="page-shell.js"></script><script src="conta.js"></script>
</body>
</html>
