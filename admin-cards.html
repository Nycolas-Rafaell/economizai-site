<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cards cadastrados | Economizaí</title>
  <link rel="stylesheet" href="institutional.css"><link rel="stylesheet" href="admin-ui.css"><link rel="stylesheet" href="admin-cards-ui.css">
  <style>
    body{margin:0;background:#0b0b0c;color:#f5f5f5;font:16px Inter,system-ui}.cards-page{max-width:1180px;margin:0 auto;padding:34px 24px 80px}.cards-page .list{display:grid;gap:12px}.cards-page .saved-card{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:17px;border:1px solid #303030;border-radius:12px;background:#171717}.cards-page .saved-card>div:first-child{min-width:0;flex:1}.cards-page .saved-card strong,.cards-page .saved-card small{display:block}.cards-page .saved-card small{margin-top:5px;color:#aaa}.cards-page .saved-card.status-available{border-color:#34c778}.cards-page .saved-card.status-unavailable{border-color:#ef5a50}.cards-page .saved-card.status-pending{border-color:#ffc42d}.offer-status{display:inline-block;margin-top:8px;padding:4px 7px;border-radius:5px;background:#111;font-size:11px;font-weight:800}.status-available .offer-status{color:#76e5a8}.status-unavailable .offer-status{color:#ff8981}.status-pending .offer-status{color:#ffc42d}.card-actions{display:grid;grid-template-columns:repeat(2,112px);gap:8px}.card-actions a,.card-actions button{display:grid;place-items:center;min-height:42px;border:1px solid #3a3a3a;border-radius:9px;background:#202020;color:#ffc42d;text-decoration:none;font:800 13px Inter,system-ui;cursor:pointer}.card-actions .delete{border-color:#8e3d39;background:#241717;color:#ff9c96}.empty{padding:42px;border:1px dashed #3a3a3a;border-radius:12px;text-align:center;color:#aaa}@media(max-width:600px){.cards-page{padding:24px 16px 55px}.cards-page .saved-card{align-items:stretch;flex-direction:column}.card-actions{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <main class="cards-page admin-page">
    <header class="admin-topbar"><div><p class="admin-kicker">Economizaí · catálogo</p><h1>Cards cadastrados</h1><p class="lead">Encontre rapidamente uma oferta, confira o status e abra a edição quando necessário.</p></div><a class="back" href="analytics.html">← Voltar ao painel</a></header>
    <nav class="admin-nav" aria-label="Atalhos do catálogo"><a href="admin.html?cadastro=1#cadastro"><b>＋</b> Nova oferta</a><a href="#lista"><b>▦</b> Gerenciar cards</a><a href="analytics.html"><b>▥</b> Análises</a><a href="reportes.html"><b>✦</b> Atendimento</a><a href="admin-users.html"><b>♙</b> Usuários</a><a href="index.html"><b>↗</b> Ver site</a></nav>
    <section class="admin-overview" aria-label="Filtrar cards por status"><button class="admin-metric available" type="button" data-status-filter="available" aria-pressed="false" title="Mostrar somente cards disponíveis"><small>Disponíveis</small><strong id="metricAvailable">—</strong><span>Ver cards</span></button><button class="admin-metric pending" type="button" data-status-filter="pending" aria-pressed="false" title="Mostrar somente cards aguardando publicação"><small>Aguardando publicação</small><strong id="metricPending">—</strong><span>Ver cards</span></button><button class="admin-metric unavailable" type="button" data-status-filter="unavailable" aria-pressed="false" title="Mostrar somente cards indisponíveis"><small>Indisponíveis</small><strong id="metricUnavailable">—</strong><span>Ver cards</span></button></section>
    <section class="saved" id="lista"><div class="admin-list-toolbar"><strong id="cardsCounter">Carregando…</strong><input id="search" type="search" placeholder="Buscar por nome, categoria ou tipo"></div><p class="hint" id="hint">Carregando cards…</p><div class="list" id="cards"></div></section>
  </main>
  <script src="admin-cards.js"></script>
</body>
</html>
