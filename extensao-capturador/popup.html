<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capturar para Economizaí</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <p class="eyebrow">ECONOMIZAÍ · CAPTURA RÁPIDA</p><h1>Adicionar produto</h1>
    <p class="hint">A extensão gera o link na Barra de Afiliados e envia o produto ao Economizaí no mesmo clique. Se necessário, você ainda pode informar o link manualmente.</p>
    <label class="auto-capture" for="autoCapture"><input id="autoCapture" type="checkbox"><span><strong>Captura automática</strong><small>Ao abrir um produto do Mercado Livre, cria o card como aguardando publicação.</small></span></label>
    <label for="affiliateUrl">Seu link de afiliado <small>(preenchido automaticamente)</small></label>
    <input id="affiliateUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://meli.la/...">
    <details><summary>Configuração do painel</summary><label for="destination">Endereço do Economizaí</label><input id="destination" type="url" placeholder="http://localhost:3000"></details>
    <button id="capture" type="button">Gerar link e adicionar produto →</button><p id="status" aria-live="polite"></p>
  </main><script src="popup.js"></script>
</body></html>
