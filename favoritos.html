<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meus favoritos | Economizaí</title><link rel="stylesheet" href="institutional.css">
  <style>
    .favorites{max-width:1120px;margin:0 auto;padding:50px 24px 80px}.favorites h1{margin:0;color:#ffc42d;font:800 32px Sora,system-ui}.lead{margin:7px 0 28px;color:#aaa}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{overflow:hidden;border:1px solid #303030;border-radius:13px;background:#171717;transition:transform .18s ease,border-color .18s ease}.card:hover{transform:translateY(-3px);border-color:#555}.media{position:relative;height:188px;background:#fff}.media img{width:100%;height:100%;object-fit:contain;padding:10px}.star{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border:0;border-radius:9px;background:#ffc42d;color:#111;font-size:23px;cursor:pointer}.body{padding:15px}.title{min-height:43px;font-weight:700;line-height:1.35}.price{margin:12px 0;color:#ffc42d;font:800 21px Sora,system-ui}.open{display:block;border-radius:7px;background:#ffc42d;color:#111;padding:10px;text-align:center;font:800 13px Inter,system-ui}.empty{padding:46px 22px;border:1px dashed #3a3a3a;border-radius:13px;color:#aaa;text-align:center}.empty a{color:#ffc42d;font-weight:800}@media(max-width:600px){.favorites{padding:34px 16px 55px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.media{height:150px}.title{font-size:13px}.price{font-size:17px}}
  </style>
</head>
<body><header data-site-header></header><main class="favorites"><h1>Meus favoritos</h1><p class="lead">Produtos que você marcou para acompanhar.</p><div id="content" class="grid"></div></main><footer class="site-footer" data-site-footer></footer><script src="site.js"></script><script src="page-shell.js"></script><script src="favoritos.js"></script></body>
</html>
